name: Provision localwebrs release secrets

on:
  workflow_dispatch:

permissions: {}

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Copy organization secrets to the private source repository
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.LOCALWEBRS_PROVISION_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          set_secret() {
            local name="$1"
            local value="$2"
            [[ -n "$value" ]] || {
              echo "missing organization secret: $name" >&2
              return 1
            }
            printf '%s' "$value" \
              | gh secret set "$name" --repo rocrp/localwebrs
          }

          set_secret APPLE_CERTIFICATE_BASE64 "$APPLE_CERTIFICATE_BASE64"
          set_secret APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          set_secret APPLE_ID "$APPLE_ID"
          set_secret APPLE_ID_PASSWORD "$APPLE_ID_PASSWORD"
          set_secret APPLE_TEAM_ID "$APPLE_TEAM_ID"
          set_secret HOMEBREW_TAP_TOKEN "$HOMEBREW_TAP_TOKEN"
